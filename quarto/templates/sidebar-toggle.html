<script>
document.addEventListener('DOMContentLoaded', function () {
  const desktopQuery = window.matchMedia('(min-width: 992px)');
  const rightSidebar = document.getElementById('quarto-margin-sidebar');

  if (!rightSidebar) {
    return;
  }

  const btn = document.createElement('button');
  btn.id = 'right-sidebar-toggle';
  btn.type = 'button';
  btn.setAttribute('aria-controls', 'quarto-margin-sidebar');
  document.body.appendChild(btn);

  let collapsed = false;

  function resetSidebar() {
    rightSidebar.style.width = '';
    rightSidebar.style.minWidth = '';
    rightSidebar.style.overflow = '';
    rightSidebar.style.padding = '';
  }

  function setButtonState() {
    btn.hidden = !desktopQuery.matches;

    if (!desktopQuery.matches) {
      resetSidebar();
      return;
    }

    const rect = rightSidebar.getBoundingClientRect();
    btn.innerHTML = collapsed ? '&#8249;' : '&#8250;';
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.setAttribute('aria-label', collapsed ? '目次を開く' : '目次を折りたたむ');
    btn.style.left = collapsed ? (window.innerWidth - 18) + 'px' : (rect.left - 24) + 'px';
  }

  function collapseSidebar() {
    rightSidebar.style.width = '0';
    rightSidebar.style.minWidth = '0';
    rightSidebar.style.overflow = 'hidden';
    rightSidebar.style.padding = '0';
    collapsed = true;
    setButtonState();
  }

  function expandSidebar() {
    resetSidebar();
    collapsed = false;
    requestAnimationFrame(setButtonState);
  }

  btn.addEventListener('click', function () {
    if (!desktopQuery.matches) {
      return;
    }
    if (collapsed) {
      expandSidebar();
    } else {
      collapseSidebar();
    }
  });

  desktopQuery.addEventListener('change', setButtonState);
  window.addEventListener('resize', setButtonState);
  setButtonState();
});
</script>
