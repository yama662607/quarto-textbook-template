project:
  type: book
  # Quarto 公式推奨は _book (https://quarto.org/docs/books/)
  output-dir: _book
  resources:
    - "assets/pdf/**/*.pdf"
    - "assets/images/**/*.png"
    - "assets/images/**/*.jpg"
    # Quarto Live (Pyodide) 用 — Noto Sans JP フォントを matplotlib に
    # 届けるために配布対象に含める。詳細は AGENTS.md の「対話シミュレーション」節。
    - "assets/fonts/**/*"
  preview:
    host: 0.0.0.0
    port: 4312
    watch-inputs: true

book:
  title: "Quarto Textbook Template"
  author: "Your Name"
  date: last-modified

  # GitHub 連携 (utilizes book.repo-url + repo-actions for "Edit" / "Issue" links)
  # テンプレ利用時は自分のリポジトリ URL に書き換えてください。
  repo-url: https://github.com/yama662607/quarto-textbook-template
  repo-branch: main
  repo-actions: [edit, issue]

  # PDF ダウンロードボタン (uv sync --extra notebook 等で計算ブロックを使う場合)
  # downloads: [pdf]

  # 引用情報 (Cite this book → BibTeX 出力)
  # citation: true

  # 検索を有効化
  search: true

  navbar:
    left:
      - text: "ホーム"
        href: index.qmd
  sidebar:
    style: "docked"
    collapse-level: 4
  # 新規の単独 qmd はここに追加する。
  # textbook/_*.qmd partial はここへ直接追加せず、textbook/textbook.qmd に include する。
  chapters:
    - index.qmd
    - textbook/textbook.qmd
    # 以下はテンプレート利用者向けの支援ページ。
    # 派生プロジェクトを公開するときは、本文・演習・シミュレーションを先に置き、
    # 不要な支援ページは削除するか sidebar 下部 / support 配下へ移動する。
    - part: "導線サンプル"
      chapters:
        - example-map.qmd
        - examples/topic-overview.qmd
        - examples/simulation-page.qmd
        - examples/exercise-page.qmd
        - examples/support-page.qmd
        - examples/paper-deep-dive-page.qmd
    - part: "章テンプレート"
      chapters:
        - template-catalog.qmd
        - template-pages/textbook.qmd
        - template-pages/math-focused.qmd
        - template-pages/theory.qmd
        - template-pages/quarto-features.qmd
    - workflow-guide.qmd
  page-navigation: true
  page-footer:
    left: "© Your Name"
    right:
      - text: "ホーム"
        href: index.qmd

# 文献ファイル — quarto/templates/references.bib を参照
bibliography: templates/references.bib

number-sections: false
crossref:
  chapters: true
  sec-prefix: "節"
  fig-prefix: "図"
  tbl-prefix: "表"
  eq-prefix: "式"

lang: ja

format:
  html:
    theme: cosmo
    css: templates/styles.css
    include-in-header: templates/plotly-loader.html
    include-after-body: templates/sidebar-toggle.html
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: true
    code-tools: true
    code-copy: true
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top
    grid:
      body-width: 1100px
      margin-width: 250px
      sidebar-width: 250px
      gutter-width: 1.5rem
    html-math-method: katex
    lightbox: auto
  pdf:
    include-in-header: preamble.tex
    pdf-engine: xelatex
    top-level-division: chapter
    number-sections: true
    number-depth: 2

execute:
  freeze: auto
