name: Quarto Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to push the gh-pages branch
  pages: write      # required by quarto-actions/publish

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        # Pin via the official action — no curl-pipe-bash, no $HOME/.local/bin
        # PATH munging required. astral-sh/setup-uv handles caching too.
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        # By default we install only base deps. If your textbook uses
        # optional features (e.g. Qiskit blocks, Shinylive, Jupyter compute
        # cells, OCR/LaTeX pipelines), append the relevant extras:
        #   uv sync --extra notebook --extra quantum
        # or:  uv sync --all-extras
        run: |
          uv sync
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: quarto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
